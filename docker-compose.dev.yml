version: '3.8'

# 开发环境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # 后端服务 - 开发模式
  backend:
    volumes:
      # 挂载代码目录以支持热重载
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 前端服务 - 开发模式（使用 Vite 开发服务器）
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chatai-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - chatai-network
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

