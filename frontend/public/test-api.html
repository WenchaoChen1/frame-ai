<!DOCTYPE html>
<html>
<head>
    <title>API测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>用户管理 API 测试</h1>
    
    <div>
        <button onclick="testGetUsers()">测试获取用户列表</button>
        <button onclick="testAuth()">测试认证信息</button>
        <button onclick="clearStorage()">清除存储</button>
    </div>
    
    <div id="result" class="result"></div>
    
    <script>
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');
        
        document.getElementById('result').innerHTML = `
            <h3>当前状态</h3>
            <p><strong>Token:</strong> ${token ? '✅ 已设置' : '❌ 未设置'}</p>
            <p><strong>User:</strong> ${user ? JSON.stringify(JSON.parse(user), null, 2) : '❌ 未设置'}</p>
        `;
        
        async function testGetUsers() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>正在请求...</p>';
            
            try {
                const response = await fetch('/api/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                result.innerHTML = `
                    <h3>响应结果</h3>
                    <p><strong>状态码:</strong> ${response.status}</p>
                    <p><strong>数据:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h3>错误</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
        
        async function testAuth() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>正在验证认证...</p>';
            
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                result.innerHTML = `
                    <h3>认证结果</h3>
                    <p><strong>状态码:</strong> ${response.status}</p>
                    <p><strong>用户信息:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `
                    <h3>错误</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
